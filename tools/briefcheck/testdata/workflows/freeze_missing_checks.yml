name: freeze

on:
  pull_request:
    types: [closed]
    branches:
      - 'tests/*'

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vet
        run: go vet ./...
      - name: Tag frozen
        run: |
          if [ "$SIZE" = "S" ]; then
            git tag frozen/$ID
            git push origin frozen/$ID
          fi
