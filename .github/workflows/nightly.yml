name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list-targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: list-targets
        run: |
          TARGETS=$(go run ./tools/covercheck fuzz-targets .)
          echo "targets=${TARGETS}" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.list.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run fuzz target
        run: go test -run '^$' -fuzz '^${{ matrix.target.name }}$' -fuzztime 1h ${{ matrix.target.package }}
      - name: Upload crasher
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crasher-${{ matrix.target.name }}
          path: ${{ matrix.target.package }}/testdata/fuzz
