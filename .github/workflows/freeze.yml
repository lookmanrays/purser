name: freeze
on:
  pull_request: {types: [closed], branches: ['tests/*']}
jobs:
  freeze:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: go vet ./... && make briefcheck && make red
      - run: if [ "$SIZE" = "S" ]; then git tag frozen/$ID && git push origin frozen/$ID; fi
